name: Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    name: Create Preview Update
    steps:
      - name: Checkout
        uses: eas/checkout@v1

      - name: Setup Node.js
        uses: eas/use-npm-token@v1

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --ci

      - name: Create EAS Update
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --branch preview-${{ github.event.pull_request.number }}
