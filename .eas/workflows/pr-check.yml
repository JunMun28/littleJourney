name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-and-test:
    name: Lint and Test
    steps:
      - name: Checkout
        uses: eas/checkout@v1

      - name: Setup Node.js
        uses: eas/use-npm-token@v1

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --ci --coverage

      - name: Upload coverage
        uses: eas/upload-artifact@v1
        with:
          name: coverage
          path: coverage/
